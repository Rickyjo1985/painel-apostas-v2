<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Painel Apostas Premium</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; }
        .gold-glow { box-shadow: 0 0 20px rgba(251, 191, 36, 0.15); }
        .tab-active { border-bottom: 3px solid #fbbf24; color: #fbbf24; font-weight: 700; }
        .tab-inactive { color: #94a3b8; }
        .odd-btn { transition: all 0.2s; }
        .odd-btn:hover { transform: scale(1.05); background-color: #059669; }
        .european-card { border: 2px solid #3b82f6 !important; }
        .european-badge { background: linear-gradient(135deg, #3b82f6, #1e40af); }
    </style>
</head>
<body class="bg-slate-900 text-gray-100 min-h-screen flex flex-col">

    <header class="bg-slate-800 border-b border-slate-700 sticky top-0 z-50">
        <div class="max-w-3xl mx-auto px-4 py-4 flex items-center justify-between">
            <div class="flex items-center gap-3">
                <div class="bg-amber-400 text-slate-900 p-2 rounded-lg">
                    <i class="fa-solid fa-crown text-xl"></i>
                </div>
                <div>
                    <h1 class="text-xl font-extrabold tracking-tight text-white">PAINEL <span class="text-amber-400">PREMIUM</span></h1>
                    <p class="text-xs text-gray-400" id="status-text">A carregar...</p>
                </div>
            </div>
            <div class="bg-emerald-500/10 text-emerald-400 px-3 py-1 rounded-full text-xs font-bold border border-emerald-500/20 flex items-center">
                <span class="relative flex h-2 w-2 mr-2">
                    <span class="animate-ping absolute inline-flex h-full w-full rounded-full bg-emerald-400 opacity-75"></span>
                    <span class="relative inline-flex rounded-full h-2 w-2 bg-emerald-500"></span>
                </span>
                Ao Vivo
            </div>
        </div>
    </header>

    <nav class="bg-slate-800/50 border-b border-slate-700 sticky top-[73px] z-40">
        <div class="max-w-3xl mx-auto px-4">
            <div class="flex overflow-x-auto gap-6">
                <button onclick="switchTab('today')" class="tab-active py-4 px-1 text-sm whitespace-nowrap" id="tab-today">Hoje</button>
                <button onclick="switchTab('tomorrow')" class="tab-inactive py-4 px-1 text-sm whitespace-nowrap" id="tab-tomorrow">Amanhã</button>
                <button onclick="switchTab('weekend')" class="tab-inactive py-4 px-1 text-sm whitespace-nowrap" id="tab-weekend">Fim de Semana</button>
                <button onclick="switchTab('bestBets')" class="tab-inactive py-4 px-1 text-sm whitespace-nowrap" id="tab-bestBets">⭐ Top 6</button>
            </div>
        </div>
    </nav>

    <main class="flex-grow max-w-3xl mx-auto px-4 py-6 space-y-6 w-full">
        <div id="loading" class="text-center py-12">
            <div class="inline-block animate-spin rounded-full h-8 w-8 border-t-2 border-b-2 border-amber-400 mb-3"></div>
            <p class="text-gray-400">A carregar jogos reais...</p>
        </div>
        <div id="matches-container" class="space-y-6 hidden"></div>
        <div id="error-message" class="hidden text-center py-12 text-gray-400 bg-slate-800 rounded-2xl border border-slate-700 p-6">
            <i class="fa-solid fa-circle-info text-4xl mb-3 text-amber-400"></i>
            <p id="error-text" class="font-bold text-lg mb-2">Sem jogos disponíveis</p>
            <p id="error-detail" class="text-sm text-gray-500"></p>
        </div>
    </main>

    <footer class="bg-slate-800 border-t border-slate-700 mt-8 py-6">
        <div class="max-w-3xl mx-auto px-4 text-center">
            <p class="text-gray-500 text-xs">Jogue com responsabilidade. © 2026 Painel Apostas Premium.</p>
        </div>
    </footer>

    <script>
        const FOOTBALL_API_KEY = '56031cfaefbb448f836803d7b7d01c4b';
        let allMatchesData = null;
        let currentTab = 'today';

        // Timeout de segurança: se demorar mais de 15s, mostra mensagem
        setTimeout(() => {
            if (document.getElementById('loading').style.display !== 'none') {
                showError('Tempo esgotado', 'A ligação está demorada. Recarrega a página (Ctrl+F5).');
            }
        }, 15000);

        function showError(title, detail) {
            document.getElementById('loading').style.display = 'none';
            document.getElementById('matches-container').classList.add('hidden');
            document.getElementById('error-message').classList.remove('hidden');
            document.getElementById('error-text').innerText = title;
            document.getElementById('error-detail').innerText = detail;
        }

        // Verificar se é liga europeia
        function isEuropean(leagueName, leagueCode) {
            const europeanCodes = ['PL', 'PD', 'BL1', 'SA', 'FL1', 'PPL', 'CL', 'EC', 'EC1', 'DED'];
            if (leagueCode && europeanCodes.includes(leagueCode)) return true;
            if (!leagueName) return false;
            const lower = leagueName.toLowerCase();
            const keywords = ['premier league', 'la liga', 'bundesliga', 'serie a', 'ligue 1', 
                            'primeira liga', 'liga portugal', 'champions', 'europa league', 
                            'eredivisie', 'uefa', 'english', 'spanish', 'german', 'italian', 
                            'french', 'portuguese'];
            return keywords.some(kw => lower.includes(kw));
        }

        // Carregar jogos via TheSportsDB (funciona SEMPRE, sem chave)
        async function loadFromTheSportsDB() {
            console.log('📡 A usar TheSportsDB...');
            const now = new Date();
            const dates = [];
            
            // Gerar datas para hoje + próximos 10 dias
            for (let i = 0; i < 10; i++) {
                const d = new Date(now);
                d.setDate(d.getDate() + i);
                dates.push(d.toISOString().split('T')[0]);
            }

            const allMatches = [];
            for (const dateStr of dates) {
                try {
                    const url = `https://www.thesportsdb.com/api/v1/json/3/eventsday.php?d=${dateStr}&s=Soccer`;
                    const response = await fetch(url);
                    if (response.ok) {
                        const data = await response.json();
                        if (data.events) {
                            data.events.forEach(e => {
                                allMatches.push({
                                    utcDate: e.strTimestamp || (e.dateEvent + 'T' + (e.strTime || '20:00:00')),
                                    homeTeam: { 
                                        name: e.strHomeTeam || 'Casa', 
                                        shortName: (e.strHomeTeam || 'CAS').substring(0, 3).toUpperCase() 
                                    },
                                    awayTeam: { 
                                        name: e.strAwayTeam || 'Fora', 
                                        shortName: (e.strAwayTeam || 'FOR').substring(0, 3).toUpperCase() 
                                    },
                                    competition: { 
                                        name: e.strLeague || 'Futebol', 
                                        code: '' 
                                    },
                                    status: 'SCHEDULED'
                                });
                            });
                        }
                    }
                } catch (e) {
                    console.warn('Erro ao buscar', dateStr, e);
                }
            }
            return allMatches;
        }

        async function loadMatches() {
            try {
                console.log('🔍 A iniciar...');
                
                // Tentar carregar
                const allMatches = await loadFromTheSportsDB();
                
                console.log('✅ Jogos carregados:', allMatches.length);

                if (allMatches.length === 0) {
                    showError('Sem jogos', 'Não há jogos disponíveis para os próximos dias.');
                    return;
                }

                // Processar e organizar
                processMatches(allMatches);
                document.getElementById('status-text').innerText = `${allMatchesData.today.length + allMatchesData.tomorrow.length + allMatchesData.weekend.length} jogos carregados`;
                displayCurrentTab();

            } catch (error) {
                console.error('❌ Erro:', error);
                showError('Erro', error.message || 'Não foi possível carregar os jogos.');
            }
        }

        function processMatches(allMatches) {
            const now = new Date();
            
            function getLisbonDate(dateString) {
                try {
                    return new Date(dateString).toLocaleString('en-US', { timeZone: 'Europe/Lisbon' }).split(',')[0];
                } catch (e) {
                    return '';
                }
            }

            const todayStr = getLisbonDate(now);
            const tomorrow = new Date(now); tomorrow.setDate(tomorrow.getDate() + 1);
            const tomorrowStr = getLisbonDate(tomorrow);

            const dayOfWeek = now.getDay();
            let daysUntilFriday = (5 - dayOfWeek + 7) % 7 || 7;
            let daysUntilSaturday = (6 - dayOfWeek + 7) % 7 || 7;
            if (dayOfWeek === 5) { daysUntilFriday = 0; daysUntilSaturday = 1; }
            if (dayOfWeek === 6) { daysUntilFriday = 6; daysUntilSaturday = 0; }
            if (dayOfWeek === 0) { daysUntilFriday = 5; daysUntilSaturday = 6; }
            
            const friday = new Date(now); friday.setDate(friday.getDate() + daysUntilFriday);
            const fridayStr = getLisbonDate(friday);
            const saturday = new Date(now); saturday.setDate(saturday.getDate() + daysUntilSaturday);
            const saturdayStr = getLisbonDate(saturday);
            const sunday = new Date(saturday); sunday.setDate(sunday.getDate() + 1);
            const sundayStr = getLisbonDate(sunday);

            const todayMatches = allMatches.filter(m => getLisbonDate(m.utcDate) === todayStr);
            const tomorrowMatches = allMatches.filter(m => getLisbonDate(m.utcDate) === tomorrowStr);
            const weekendMatches = allMatches.filter(m => {
                const d = getLisbonDate(m.utcDate);
                return d === saturdayStr || d === sundayStr;
            });
            const weekendDaysMatches = allMatches.filter(m => {
                const d = getLisbonDate(m.utcDate);
                return d === fridayStr || d === saturdayStr || d === sundayStr;
            });

            // Separar europeus e outros
            function separate(matches) {
                const european = matches.filter(m => isEuropean(m.competition.name, m.competition.code));
                const others = matches.filter(m => !isEuropean(m.competition.name, m.competition.code));
                return { european, others };
            }

            allMatchesData = {
                today: separate(todayMatches),
                tomorrow: separate(tomorrowMatches),
                weekend: separate(weekendMatches),
                bestBets: weekendDaysMatches.filter(m => isEuropean(m.competition.name, m.competition.code)).slice(0, 6)
            };

            // Se não houver europeus no bestBets, usar os primeiros 6 do fim de semana
            if (allMatchesData.bestBets.length === 0) {
                allMatchesData.bestBets = weekendDaysMatches.slice(0, 6);
            }

            console.log('📊 Resumo:');
            console.log('  Hoje:', allMatchesData.today.european.length, 'euro +', allMatchesData.today.others.length, 'outros');
            console.log('  Amanhã:', allMatchesData.tomorrow.european.length, 'euro +', allMatchesData.tomorrow.others.length, 'outros');
            console.log('  Fim semana:', allMatchesData.weekend.european.length, 'euro +', allMatchesData.weekend.others.length, 'outros');
        }

        function switchTab(tabName) {
            currentTab = tabName;
            document.querySelectorAll('nav button').forEach(btn => {
                btn.classList.remove('tab-active');
                btn.classList.add('tab-inactive');
            });
            document.getElementById('tab-' + tabName).classList.remove('tab-inactive');
            document.getElementById('tab-' + tabName).classList.add('tab-active');
            displayCurrentTab();
        }

        function displayCurrentTab() {
            if (!allMatchesData) return;
            let data = null;
            let tabTitle = '';

            switch(currentTab) {
                case 'today': data = allMatchesData.today; tabTitle = 'Hoje'; break;
                case 'tomorrow': data = allMatchesData.tomorrow; tabTitle = 'Amanhã'; break;
                case 'weekend': data = allMatchesData.weekend; tabTitle = 'Fim de Semana'; break;
                case 'bestBets': data = { european: allMatchesData.bestBets, others: [] }; tabTitle = 'Top 6'; break;
            }

            document.getElementById('loading').style.display = 'none';
            const total = data.european.length + data.others.length;

            if (total === 0) {
                document.getElementById('matches-container').classList.add('hidden');
                document.getElementById('error-message').classList.remove('hidden');
                document.getElementById('error-text').innerText = `Sem jogos para "${tabTitle}"`;
                document.getElementById('error-detail').innerText = 'Não há jogos agendados para esta categoria.';
                return;
            }

            document.getElementById('error-message').classList.add('hidden');
            displayMatches(data, currentTab === 'bestBets');
        }

        function displayMatches(data, isBestBets = false) {
            const container = document.getElementById('matches-container');
            container.innerHTML = '';

            // Secção Europeia
            if (data.european.length > 0) {
                container.innerHTML += `
                    <div class="bg-blue-600/20 border border-blue-500/30 rounded-xl p-4">
                        <p class="text-blue-400 font-bold text-sm"><i class="fa-solid fa-star mr-2"></i>LIGAS EUROPEIAS EM DESTAQUE</p>
                    </div>
                `;
                data.european.forEach((match, index) => {
                    const betNum = isBestBets ? index + 1 : null;
                    container.innerHTML += createCard(match, true, betNum);
                });
            } else if (!isBestBets) {
                container.innerHTML += `
                    <div class="bg-slate-800/50 border border-slate-700 rounded-xl p-4 text-center">
                        <p class="text-gray-400 text-sm"><i class="fa-solid fa-info-circle mr-2 text-blue-400"></i>As ligas europeias jogam normalmente ao fim de semana.</p>
                    </div>
                `;
            }

            // Secção Outras
            if (data.others.length > 0) {
                if (data.european.length > 0) {
                    container.innerHTML += `
                        <div class="bg-slate-800/50 border border-slate-700 rounded-xl p-4 mt-6">
                            <p class="text-gray-400 font-bold text-sm"><i class="fa-solid fa-globe mr-2"></i>OUTRAS LIGAS</p>
                        </div>
                    `;
                }
                data.others.forEach(match => {
                    container.innerHTML += createCard(match, false, null);
                });
            }

            container.classList.remove('hidden');
        }

        function createCard(match, isEuropean, betNumber = null) {
            const date = new Date(match.utcDate);
            const time = date.toLocaleTimeString('pt-PT', { hour: '2-digit', minute: '2-digit' });
            const dateStr = date.toLocaleDateString('pt-PT', { day: '2-digit', month: '2-digit', year: 'numeric' });
            
            const label = betNumber ? `⭐ APOSTA #${betNumber}` : (isEuropean ? '⭐ DESTAQUE' : '');
            const cardClass = isEuropean ? 'european-card' : 'border-slate-700';

            return `
                <div class="bg-slate-800 border rounded-2xl p-5 relative ${cardClass}">
                    ${label ? `<div class="absolute top-0 right-0 bg-amber-400 text-slate-900 text-xs font-extrabold px-3 py-1 rounded-bl-lg rounded-tr-2xl">${label}</div>` : ''}
                    <div class="flex items-center gap-2 text-gray-400 text-sm font-semibold mb-4 flex-wrap">
                        <i class="fa-solid fa-trophy text-amber-400"></i>
                        <span>${match.competition.name}</span>
                        ${isEuropean ? '<span class="european-badge text-white text-[10px] font-bold px-2 py-0.5 rounded-full"><i class="fa-solid fa-star mr-1"></i>EUROPA</span>' : ''}
                        <span class="text-gray-600">•</span>
                        <span><i class="fa-regular fa-clock mr-1"></i>${dateStr} às ${time}</span>
                    </div>
                    <div class="flex items-center justify-between mb-4">
                        <div class="text-center flex-1">
                            <div class="w-12 h-12 bg-slate-700 rounded-full mx-auto mb-2 flex items-center justify-center text-sm font-bold text-gray-300">${match.homeTeam.shortName}</div>
                            <p class="font-bold text-sm">${match.homeTeam.name}</p>
                        </div>
                        <div class="text-gray-600 font-bold text-xl px-2">VS</div>
                        <div class="text-center flex-1">
                            <div class="w-12 h-12 bg-slate-700 rounded-full mx-auto mb-2 flex items-center justify-center text-sm font-bold text-gray-300">${match.awayTeam.shortName}</div>
                            <p class="font-bold text-sm">${match.awayTeam.name}</p>
                        </div>
                    </div>
                    <div class="bg-slate-900/80 rounded-xl p-4 border border-slate-600">
                        <p class="text-xs text-amber-400 font-bold uppercase mb-3"><i class="fa-solid fa-chart-bar mr-1"></i> Sugestão</p>
                        <div class="flex items-center justify-between bg-emerald-500/10 border border-emerald-500/20 rounded-lg p-3">
                            <p class="text-xs text-emerald-400 font-bold">Mais de 1.5 Golos</p>
                            <button class="odd-btn bg-emerald-500 text-slate-900 font-extrabold text-lg px-4 py-1.5 rounded-lg">@1.45</button>
                        </div>
                    </div>
                </div>
            `;
        }

        loadMatches();
    </script>
</body>
</html>
