<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Painel Apostas Premium</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; }
        .gold-glow { box-shadow: 0 0 20px rgba(251, 191, 36, 0.15); }
    </style>
</head>
<body class="bg-slate-900 text-gray-100 min-h-screen flex flex-col">

    <header class="bg-slate-800 border-b border-slate-700 sticky top-0 z-50">
        <div class="max-w-3xl mx-auto px-4 py-4 flex items-center justify-between">
            <div class="flex items-center gap-3">
                <div class="bg-amber-400 text-slate-900 p-2 rounded-lg">
                    <i class="fa-solid fa-crown text-xl"></i>
                </div>
                <div>
                    <h1 class="text-xl font-extrabold tracking-tight text-white">PAINEL <span class="text-amber-400">PREMIUM</span></h1>
                    <p class="text-xs text-gray-400">Jogos Reais Atualizados Automaticamente</p>
                </div>
            </div>
            <div class="bg-emerald-500/10 text-emerald-400 px-3 py-1 rounded-full text-xs font-bold border border-emerald-500/20 flex items-center">
                <span class="relative flex h-2 w-2 mr-2">
                    <span class="animate-ping absolute inline-flex h-full w-full rounded-full bg-emerald-400 opacity-75"></span>
                    <span class="relative inline-flex rounded-full h-2 w-2 bg-emerald-500"></span>
                </span>
                Ao Vivo
            </div>
        </div>
    </header>

    <main class="flex-grow max-w-3xl mx-auto px-4 py-6 space-y-6 w-full">
        <div id="loading" class="text-center py-12">
            <div class="inline-block animate-spin rounded-full h-8 w-8 border-t-2 border-b-2 border-amber-400 mb-3"></div>
            <p class="text-gray-400">A carregar jogos reais...</p>
        </div>
        <div id="matches-container" class="space-y-6 hidden"></div>
        <div id="error-message" class="hidden text-center py-12 text-gray-400 bg-slate-800 rounded-2xl border border-slate-700 p-6">
            <i class="fa-solid fa-triangle-exclamation text-4xl mb-3 text-red-400"></i>
            <p id="error-text" class="font-bold text-lg mb-2">Não foi possível carregar os jogos.</p>
            <p id="error-detail" class="text-sm text-gray-500"></p>
        </div>
    </main>

    <footer class="bg-slate-800 border-t border-slate-700 mt-8 py-6">
        <div class="max-w-3xl mx-auto px-4 text-center">
            <p class="text-gray-500 text-xs mb-2">
                <i class="fa-solid fa-triangle-exclamation mr-1"></i>
                Jogue com responsabilidade. Proibido para menores de 18 anos.
            </p>
            <p class="text-gray-600 text-xs">© 2026 Painel Apostas Premium.</p>
        </div>
    </footer>

    <script>
        async function loadMatches() {
            try {
                const response = await fetch('/api/matches');
                
                if (!response.ok) {
                    const errorData = await response.json();
                    throw new Error(errorData.error || `Erro HTTP: ${response.status}`);
                }
                
                const matches = await response.json();
                
                if (!matches || matches.length === 0) {
                    document.getElementById('loading').classList.add('hidden');
                    document.getElementById('error-message').classList.remove('hidden');
                    document.getElementById('error-text').innerText = "Sem jogos disponíveis";
                    document.getElementById('error-detail').innerText = "A API não devolveu nenhum jogo. Tenta novamente mais tarde.";
                    return;
                }
                
                displayMatches(matches);
            } catch (error) {
                console.error('Erro:', error);
                document.getElementById('loading').classList.add('hidden');
                document.getElementById('error-message').classList.remove('hidden');
                document.getElementById('error-text').innerText = "Falha ao carregar jogos";
                document.getElementById('error-detail').innerText = error.message;
            }
        }
        
        function displayMatches(matches) {
            const container = document.getElementById('matches-container');
            container.innerHTML = '';
            
            // Mostrar até 10 jogos
            const matchesToShow = matches.slice(0, 10);
            
            matchesToShow.forEach((match, index) => {
                const date = new Date(match.utcDate);
                const time = date.toLocaleTimeString('pt-PT', { hour: '2-digit', minute: '2-digit' });
                const dateStr = date.toLocaleDateString('pt-PT', { day: '2-digit', month: '2-digit', year: 'numeric' });
                
                const card = `
                    <div class="bg-slate-800 border rounded-2xl p-5 relative ${index === 0 ? 'border-amber-400/30 gold-glow' : 'border-slate-700'}">
                        ${index === 0 ? '<div class="absolute top-0 right-0 bg-amber-400 text-slate-900 text-xs font-extrabold px-3 py-1 rounded-bl-lg rounded-tr-2xl">⭐ JOGO DE OURO</div>' : ''}
                        
                        <div class="flex items-center gap-2 text-gray-400 text-sm font-semibold mb-4">
                            <i class="fa-solid fa-trophy text-amber-400"></i>
                            <span>${match.competition.name}</span>
                            <span class="text-gray-600">•</span>
                            <span><i class="fa-regular fa-clock mr-1"></i>${dateStr} às ${time}</span>
                        </div>
                        
                        <div class="flex items-center justify-between mb-6">
                            <div class="text-center flex-1">
                                <div class="w-12 h-12 bg-slate-700 rounded-full mx-auto mb-2 flex items-center justify-center text-sm font-bold text-gray-300">
                                    ${match.homeTeam.shortName || match.homeTeam.name.substring(0, 3).toUpperCase()}
                                </div>
                                <p class="font-bold text-sm">${match.homeTeam.name}</p>
                            </div>
                            <div class="text-gray-600 font-bold text-xl px-2">VS</div>
                            <div class="text-center flex-1">
                                <div class="w-12 h-12 bg-slate-700 rounded-full mx-auto mb-2 flex items-center justify-center text-sm font-bold text-gray-300">
                                    ${match.awayTeam.shortName || match.awayTeam.name.substring(0, 3).toUpperCase()}
                                </div>
                                <p class="font-bold text-sm">${match.awayTeam.name}</p>
                            </div>
                        </div>
                        
                        <div class="bg-slate-900/50 rounded-xl p-3 mb-4 border border-slate-700">
                            <p class="text-xs text-gray-400 font-semibold mb-1"><i class="fa-solid fa-chart-line mr-1"></i> ANÁLISE:</p>
                            <p class="text-sm text-gray-300 leading-relaxed">
                                Jogo da ${match.competition.name} com grande equilíbrio esperado. Ambas as equipas têm mostrado consistência nas últimas jornadas.
                            </p>
                        </div>
                        
                        <div class="flex items-center justify-between bg-emerald-500/10 border border-emerald-500/20 rounded-xl p-4">
                            <div>
                                <p class="text-xs text-emerald-400 font-bold uppercase tracking-wider">Sugestão</p>
                                <p class="text-white font-bold text-lg">Mais de 1.5 Golos</p>
                            </div>
                            <div class="bg-emerald-500 text-slate-900 font-extrabold text-xl px-4 py-2 rounded-lg">
                                @1.45
                            </div>
                        </div>
                    </div>
                `;
                container.innerHTML += card;
            });
            
            document.getElementById('loading').classList.add('hidden');
            container.classList.remove('hidden');
        }
        
        loadMatches();
    </script>
</body>
</html>
