<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Painel Apostas Premium</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; }
        .gold-glow { box-shadow: 0 0 20px rgba(251, 191, 36, 0.15); }
        .tab-active { border-bottom: 3px solid #fbbf24; color: #fbbf24; font-weight: 700; }
        .tab-inactive { color: #94a3b8; }
        .tab-inactive:hover { color: #e2e8f0; }
        .odd-btn { transition: all 0.2s; }
        .odd-btn:hover { transform: scale(1.05); background-color: #059669; }
    </style>
</head>
<body class="bg-slate-900 text-gray-100 min-h-screen flex flex-col">

    <header class="bg-slate-800 border-b border-slate-700 sticky top-0 z-50">
        <div class="max-w-3xl mx-auto px-4 py-4 flex items-center justify-between">
            <div class="flex items-center gap-3">
                <div class="bg-amber-400 text-slate-900 p-2 rounded-lg">
                    <i class="fa-solid fa-crown text-xl"></i>
                </div>
                <div>
                    <h1 class="text-xl font-extrabold tracking-tight text-white">PAINEL <span class="text-amber-400">PREMIUM</span></h1>
                    <p class="text-xs text-gray-400" id="status-text">Odds Reais Atualizadas Automaticamente</p>
                </div>
            </div>
            <div class="bg-emerald-500/10 text-emerald-400 px-3 py-1 rounded-full text-xs font-bold border border-emerald-500/20 flex items-center">
                <span class="relative flex h-2 w-2 mr-2">
                    <span class="animate-ping absolute inline-flex h-full w-full rounded-full bg-emerald-400 opacity-75"></span>
                    <span class="relative inline-flex rounded-full h-2 w-2 bg-emerald-500"></span>
                </span>
                Ao Vivo
            </div>
        </div>
    </header>

    <nav class="bg-slate-800/50 border-b border-slate-700 backdrop-blur-sm sticky top-[73px] z-40">
        <div class="max-w-3xl mx-auto px-4">
            <div class="flex overflow-x-auto gap-6 no-scrollbar">
                <button onclick="switchTab('today')" class="tab-active py-4 px-1 text-sm whitespace-nowrap transition-colors" id="tab-today">Hoje</button>
                <button onclick="switchTab('tomorrow')" class="tab-inactive py-4 px-1 text-sm whitespace-nowrap transition-colors" id="tab-tomorrow">Amanhã</button>
                <button onclick="switchTab('weekend')" class="tab-inactive py-4 px-1 text-sm whitespace-nowrap transition-colors" id="tab-weekend">Fim de Semana</button>
                <button onclick="switchTab('bestBets')" class="tab-inactive py-4 px-1 text-sm whitespace-nowrap transition-colors" id="tab-bestBets">⭐ Top 6 (Sex-Sáb-Dom)</button>
            </div>
        </div>
    </nav>

    <main class="flex-grow max-w-3xl mx-auto px-4 py-6 space-y-6 w-full">
        <div id="loading" class="text-center py-12">
            <div class="inline-block animate-spin rounded-full h-8 w-8 border-t-2 border-b-2 border-amber-400 mb-3"></div>
            <p class="text-gray-400">A carregar jogos e odds reais...</p>
        </div>
        <div id="matches-container" class="space-y-6 hidden"></div>
        <div id="error-message" class="hidden text-center py-12 text-gray-400 bg-slate-800 rounded-2xl border border-slate-700 p-6">
            <i class="fa-solid fa-circle-info text-4xl mb-3 text-amber-400"></i>
            <p id="error-text" class="font-bold text-lg mb-2">Sem jogos disponíveis</p>
            <p id="error-detail" class="text-sm text-gray-500">Não há jogos com odds disponíveis para esta categoria no momento.</p>
        </div>
    </main>

    <footer class="bg-slate-800 border-t border-slate-700 mt-8 py-6">
        <div class="max-w-3xl mx-auto px-4 text-center">
            <p class="text-gray-500 text-xs mb-2">
                <i class="fa-solid fa-triangle-exclamation mr-1"></i>
                Jogue com responsabilidade. Proibido para menores de 18 anos.
            </p>
            <p class="text-gray-600 text-xs">© 2026 Painel Apostas Premium.</p>
        </div>
    </footer>

    <script>
        let allMatchesData = null;
        let currentTab = 'today';

        async function loadMatches() {
            try {
                console.log('🔍 A carregar odds reais...');
                const response = await fetch('/api/odds');

                if (!response.ok) {
                    throw new Error(`API Erro: ${response.status}`);
                }

                const rawData = await response.json();
                console.log('✅ Odds reais carregadas:', rawData.length, 'eventos');
                
                if (rawData.length === 0) {
                    showError('Sem jogos disponíveis', 'Não há jogos com odds disponíveis no momento. Tenta novamente mais tarde.');
                    return;
                }

                document.getElementById('status-text').innerText = 'Odds Reais Atualizadas Automaticamente';
                processApiData(rawData);

            } catch (error) {
                console.error('❌ Erro ao carregar:', error);
                showError('Erro ao carregar jogos', 'Não foi possível obter os dados das odds. Tenta novamente mais tarde.');
            }
        }

        function showError(title, detail) {
            document.getElementById('loading').classList.add('hidden');
            document.getElementById('matches-container').classList.add('hidden');
            document.getElementById('error-message').classList.remove('hidden');
            document.getElementById('error-text').innerText = title;
            document.getElementById('error-detail').innerText = detail;
        }

        function processApiData(rawData) {
            const processedMatches = rawData.map(event => {
                const preferredBookmakers = ['betclic', 'bet365', 'unibet'];
                let oddsInfo = { homeWin: null, draw: null, awayWin: null, over25: null, bookmaker: 'Indisponível' };

                for (const bkName of preferredBookmakers) {
                    const bk = event.bookmakers?.find(b => b.key === bkName);
                    if (bk) {
                        oddsInfo.bookmaker = bk.title;
                        const h2h = bk.markets?.find(m => m.key === 'h2h');
                        if (h2h) {
                            const home = h2h.outcomes?.find(o => o.name === event.home_team);
                            const draw = h2h.outcomes?.find(o => o.name === 'Draw');
                            const away = h2h.outcomes?.find(o => o.name === event.away_team);
                            if (home) oddsInfo.homeWin = home.price;
                            if (draw) oddsInfo.draw = draw.price;
                            if (away) oddsInfo.awayWin = away.price;
                        }
                        const totals = bk.markets?.find(m => m.key === 'totals');
                        if (totals) {
                            const over = totals.outcomes?.find(o => o.name === 'Over' && o.point === 2.5);
                            if (over) oddsInfo.over25 = over.price;
                        }
                        break;
                    }
                }

                return {
                    id: event.id,
                    league: event.sport_title,
                    homeTeam: { name: event.home_team, shortName: event.home_team.substring(0, 3).toUpperCase() },
                    awayTeam: { name: event.away_team, shortName: event.away_team.substring(0, 3).toUpperCase() },
                    utcDate: event.commence_time,
                    odds: oddsInfo
                };
            }).filter(m => m.odds.homeWin !== null);

            function getLisbonDate(dateString) {
                return new Date(dateString).toLocaleString('en-US', { timeZone: 'Europe/Lisbon' }).split(',')[0];
            }

            const now = new Date();
            const todayStr = getLisbonDate(now);
            const tomorrow = new Date(now); tomorrow.setDate(tomorrow.getDate() + 1);
            const tomorrowStr = getLisbonDate(tomorrow);

            const dayOfWeek = now.getDay();
            const daysUntilSaturday = (6 - dayOfWeek + 7) % 7 || 7;
            const saturday = new Date(now); saturday.setDate(saturday.getDate() + daysUntilSaturday);
            const saturdayStr = getLisbonDate(saturday);
            const sunday = new Date(saturday); sunday.setDate(sunday.getDate() + 1);
            const sundayStr = getLisbonDate(sunday);
            const daysUntilFriday = (5 - dayOfWeek + 7) % 7 || 7;
            const friday = new Date(now); friday.setDate(friday.getDate() + daysUntilFriday);
            const fridayStr = getLisbonDate(friday);

            const todayMatches = processedMatches.filter(m => getLisbonDate(m.utcDate) === todayStr);
            const tomorrowMatches = processedMatches.filter(m => getLisbonDate(m.utcDate) === tomorrowStr);
            const weekendMatches = processedMatches.filter(m => {
                const d = getLisbonDate(m.utcDate);
                return d === saturdayStr || d === sundayStr;
            });

            const topLeaguesKeywords = ['EPL', 'La Liga', 'Bundesliga', 'Serie A', 'Ligue 1', 'Primeira Liga', 'Champions League'];
            const weekendDaysMatches = processedMatches.filter(m => {
                const d = getLisbonDate(m.utcDate);
                return d === fridayStr || d === saturdayStr || d === sundayStr;
            });

            const bestBets = weekendDaysMatches
                .filter(m => topLeaguesKeywords.some(kw => m.league.includes(kw)))
                .sort((a, b) => new Date(a.utcDate) - new Date(b.utcDate))
                .slice(0, 6);

            allMatchesData = { 
                today: todayMatches, 
                tomorrow: tomorrowMatches, 
                weekend: weekendMatches, 
                bestBets: bestBets.length > 0 ? bestBets : weekendDaysMatches.slice(0, 6)
            };

            console.log('📊 Resumo: Hoje:', todayMatches.length, '| Amanhã:', tomorrowMatches.length, '| Fim de semana:', weekendMatches.length, '| Top 6:', bestBets.length);

            displayCurrentTab();
        }

        function switchTab(tabName) {
            currentTab = tabName;
            document.querySelectorAll('nav button').forEach(btn => {
                btn.classList.remove('tab-active');
                btn.classList.add('tab-inactive');
            });
            document.getElementById('tab-' + tabName).classList.remove('tab-inactive');
            document.getElementById('tab-' + tabName).classList.add('tab-active');
            displayCurrentTab();
        }

        function displayCurrentTab() {
            if (!allMatchesData) return;
            let matches = [];
            let tabTitle = '';

            switch(currentTab) {
                case 'today': matches = allMatchesData.today || []; tabTitle = 'Hoje'; break;
                case 'tomorrow': matches = allMatchesData.tomorrow || []; tabTitle = 'Amanhã'; break;
                case 'weekend': matches = allMatchesData.weekend || []; tabTitle = 'Fim de Semana'; break;
                case 'bestBets': matches = allMatchesData.bestBets || []; tabTitle = 'Top 6'; break;
            }

            document.getElementById('loading').classList.add('hidden');
            
            if (matches.length === 0) {
                document.getElementById('matches-container').classList.add('hidden');
                document.getElementById('error-message').classList.remove('hidden');
                document.getElementById('error-text').innerText = `Sem jogos para "${tabTitle}"`;
                document.getElementById('error-detail').innerText = 'Não há jogos com odds disponíveis para esta categoria no momento.';
                return;
            }

            document.getElementById('error-message').classList.add('hidden');
            displayMatches(matches, currentTab === 'bestBets');
        }

        function displayMatches(matches, isBestBets = false) {
            const container = document.getElementById('matches-container');
            container.innerHTML = '';
            const matchesToShow = isBestBets ? matches.slice(0, 6) : matches.slice(0, 15);

            matchesToShow.forEach((match, index) => {
                const date = new Date(match.utcDate);
                const time = date.toLocaleTimeString('pt-PT', { hour: '2-digit', minute: '2-digit' });
                const dateStr = date.toLocaleDateString('pt-PT', { day: '2-digit', month: '2-digit', year: 'numeric' });
                const isGold = isBestBets || index === 0;
                const goldLabel = isBestBets ? `⭐ APOSTA #${index + 1}` : '⭐ JOGO DE OURO';

                const odds = match.odds;
                const homeOdd = odds?.homeWin ? odds.homeWin.toFixed(2) : '-';
                const drawOdd = odds?.draw ? odds.draw.toFixed(2) : '-';
                const awayOdd = odds?.awayWin ? odds.awayWin.toFixed(2) : '-';
                const over25Odd = odds?.over25 ? odds.over25.toFixed(2) : '-';
                const bookmakerName = odds?.bookmaker || 'Indisponível';

                const card = `
                    <div class="bg-slate-800 border rounded-2xl p-5 relative ${isGold ? 'border-amber-400/30 gold-glow' : 'border-slate-700'}">
                        ${isGold ? `<div class="absolute top-0 right-0 bg-amber-400 text-slate-900 text-xs font-extrabold px-3 py-1 rounded-bl-lg rounded-tr-2xl">${goldLabel}</div>` : ''}

                        <div class="flex items-center gap-2 text-gray-400 text-sm font-semibold mb-4">
                            <i class="fa-solid fa-trophy text-amber-400"></i>
                            <span>${match.league}</span>
                            <span class="text-gray-600">•</span>
                            <span><i class="fa-regular fa-clock mr-1"></i>${dateStr} às ${time}</span>
                        </div>

                        <div class="flex items-center justify-between mb-4">
                            <div class="text-center flex-1">
                                <div class="w-12 h-12 bg-slate-700 rounded-full mx-auto mb-2 flex items-center justify-center text-sm font-bold text-gray-300">
                                    ${match.homeTeam.shortName}
                                </div>
                                <p class="font-bold text-sm">${match.homeTeam.name}</p>
                            </div>
                            <div class="text-gray-600 font-bold text-xl px-2">VS</div>
                            <div class="text-center flex-1">
                                <div class="w-12 h-12 bg-slate-700 rounded-full mx-auto mb-2 flex items-center justify-center text-sm font-bold text-gray-300">
                                    ${match.awayTeam.shortName}
                                </div>
                                <p class="font-bold text-sm">${match.awayTeam.name}</p>
                            </div>
                        </div>

                        <div class="bg-slate-900/80 rounded-xl p-4 mb-4 border border-slate-600">
                            <div class="flex items-center justify-between mb-3">
                                <p class="text-xs text-amber-400 font-bold uppercase tracking-wider">
                                    <i class="fa-solid fa-chart-bar mr-1"></i> Odds Reais
                                </p>
                                <span class="text-xs text-gray-500 bg-slate-700 px-2 py-0.5 rounded-full">${bookmakerName}</span>
                            </div>

                            <div class="grid grid-cols-3 gap-2 mb-3">
                                <button class="odd-btn bg-slate-700 hover:bg-emerald-600 rounded-lg p-2 text-center border border-slate-600">
                                    <p class="text-[10px] text-gray-400 uppercase">Casa</p>
                                    <p class="text-emerald-400 font-extrabold text-lg">${homeOdd}</p>
                                </button>
                                <button class="odd-btn bg-slate-700 hover:bg-emerald-600 rounded-lg p-2 text-center border border-slate-600">
                                    <p class="text-[10px] text-gray-400 uppercase">Empate</p>
                                    <p class="text-emerald-400 font-extrabold text-lg">${drawOdd}</p>
                                </button>
                                <button class="odd-btn bg-slate-700 hover:bg-emerald-600 rounded-lg p-2 text-center border border-slate-600">
                                    <p class="text-[10px] text-gray-400 uppercase">Fora</p>
                                    <p class="text-emerald-400 font-extrabold text-lg">${awayOdd}</p>
                                </button>
                            </div>

                            <div class="flex items-center justify-between bg-emerald-500/10 border border-emerald-500/20 rounded-lg p-3">
                                <div>
                                    <p class="text-xs text-emerald-400 font-bold">Mais de 2.5 Golos</p>
                                </div>
                                <button class="odd-btn bg-emerald-500 text-slate-900 font-extrabold text-lg px-4 py-1.5 rounded-lg">
                                    ${over25Odd}
                                </button>
                            </div>
                        </div>
                    </div>
                `;
                container.innerHTML += card;
            });

            container.classList.remove('hidden');
        }

        loadMatches();
    </script>
</body>
</html>
